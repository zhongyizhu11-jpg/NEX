<!doctype html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>NEX</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem("forwardx-theme") || "light";
          var resolved = theme === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : theme;
          document.documentElement.classList.add("fx-booting");
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(resolved === "dark" ? "dark" : "light");
          // 界面主题（设置 › 个性化 › 界面主题）：上次选的记在本地，开机先挂上，免得首屏从经典闪到极光
          var uiTheme = window.localStorage.getItem("forwardx-ui-theme");
          if (uiTheme === "aurora" || uiTheme === "gilt" || uiTheme === "rose" || uiTheme === "cinnabar" || uiTheme === "liquid-glass") document.documentElement.setAttribute("data-ui-theme", uiTheme);
          // 浏览器外框（iOS 地址栏 / 状态栏）开机就涂成这一套的页面底色；进来之后 personalizationTheme.ts 按实际底色再校一次
          var pages = { classic: ["#f5f5f7", "#1e1e1e"], aurora: ["#f4f6fb", "#0f1117"], gilt: ["#f5f2ec", "#131110"], rose: ["#fbf0f2", "#150f12"], cinnabar: ["#f6f6f4", "#0a0a0b"], "liquid-glass": ["#f8f9fb", "#111318"] };
          var page = (pages[uiTheme] || pages.classic)[resolved === "dark" ? 1 : 0];
          var meta = document.createElement("meta");
          meta.name = "theme-color";
          meta.content = page;
          document.head.appendChild(meta);
        } catch (error) {
          document.documentElement.classList.add("fx-booting", "light");
        }
      })();
    </script>
    <style>
      /* 脚本还没跑起来之前：先铺页面底色，不闪白；慢的时候顶上出一条细进度条。React 挂上后整块被替换。 */
      html.fx-booting, html.fx-booting body { margin: 0; background: #f5f5f7; }
      html.fx-booting.dark, html.fx-booting.dark body { background: #1e1e1e; }
      html.fx-booting[data-ui-theme="aurora"], html.fx-booting[data-ui-theme="aurora"] body { background: #f4f6fb; }
      html.fx-booting.dark[data-ui-theme="aurora"], html.fx-booting.dark[data-ui-theme="aurora"] body { background: #0f1117; }
      html.fx-booting[data-ui-theme="gilt"], html.fx-booting[data-ui-theme="gilt"] body { background: #f5f2ec; }
      html.fx-booting.dark[data-ui-theme="gilt"], html.fx-booting.dark[data-ui-theme="gilt"] body { background: #131110; }
      html.fx-booting[data-ui-theme="rose"], html.fx-booting[data-ui-theme="rose"] body { background: #fbf0f2; }
      html.fx-booting.dark[data-ui-theme="rose"], html.fx-booting.dark[data-ui-theme="rose"] body { background: #150f12; }
      html.fx-booting[data-ui-theme="cinnabar"], html.fx-booting[data-ui-theme="cinnabar"] body { background: #f6f6f4; }
      html.fx-booting.dark[data-ui-theme="cinnabar"], html.fx-booting.dark[data-ui-theme="cinnabar"] body { background: #0a0a0b; }
      html.fx-booting[data-ui-theme="liquid-glass"], html.fx-booting[data-ui-theme="liquid-glass"] body { background: #f8f9fb; }
      html.fx-booting.dark[data-ui-theme="liquid-glass"], html.fx-booting.dark[data-ui-theme="liquid-glass"] body { background: #111318; }
      #fx-boot { position: fixed; inset: 0 0 auto 0; height: 2px; overflow: hidden; opacity: 0; animation: fx-boot-in 0.2s ease 0.25s forwards; }
      #fx-boot::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: linear-gradient(90deg, #6cc4f5, #3ea4ec); animation: fx-boot-run 1.1s ease-in-out infinite; }
      @keyframes fx-boot-in { to { opacity: 1; } }
      @keyframes fx-boot-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #fx-boot::after { animation: none; width: 100%; } }
    </style>
  </head>

  <body>
    <div id="root"><div id="fx-boot" aria-hidden="true"></div></div>
    <div id="forwardx-overlay-root" data-forwardx-overlay-root></div>
    <script type="module" src="/client/src/main.tsx"></script>
  </body>

</html>
