<!doctype html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>NEX</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem("forwardx-theme") || "light";
          var resolved = theme === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : theme;
          document.documentElement.classList.add("fx-booting");
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(resolved === "dark" ? "dark" : "light");
          // 界面主题（设置 › 个性化 › 界面主题）：上次选的记在本地，开机先挂上，免得首屏从经典闪到别的主题。
          // 内置的是珍珠、液态玻璃；其余是装上去的主题包，认不认要看上次记下的那份名单（client/src/lib/installedUiThemes.ts）。
          var uiTheme = window.localStorage.getItem("forwardx-ui-theme");
          var pages = { classic: ["#f5f5f7", "#1e1e1e"], pearl: ["#f4f6f5", "#161b1e"], "liquid-glass": ["#f8f9fb", "#111318"] };
          var hex = /^#[0-9a-fA-F]{3,8}$/;
          var known = uiTheme === "pearl" || uiTheme === "liquid-glass";
          // 主题安全模式（?themeSafe=1，见 client/src/lib/personalizationTheme.ts）：这个标签页里不挂主题包
          var safeFlag = new URLSearchParams(window.location.search).get("themeSafe");
          if (safeFlag === "1") window.sessionStorage.setItem("forwardx-ui-theme-safe", "1");
          else if (safeFlag === "0") window.sessionStorage.removeItem("forwardx-ui-theme-safe");
          var safeMode = window.sessionStorage.getItem("forwardx-ui-theme-safe") === "1";
          if (!known && uiTheme && !safeMode) {
            try {
              var installed = JSON.parse(window.localStorage.getItem("forwardx-ui-themes") || "[]");
              for (var i = 0; i < installed.length; i++) {
                var item = installed[i];
                if (!item || item.id !== uiTheme || !/^[a-z][a-z0-9-]{1,30}[a-z0-9]$/.test(uiTheme)) continue;
                var preview = item.preview || {};
                var lightPage = preview.light && hex.test(preview.light.page) ? preview.light.page : pages.classic[0];
                var darkPage = preview.dark && hex.test(preview.dark.page) ? preview.dark.page : pages.classic[1];
                pages[uiTheme] = [lightPage, darkPage];
                known = true;
                break;
              }
            } catch (ignored) {}
          }
          if (known) document.documentElement.setAttribute("data-ui-theme", uiTheme);
          // 浏览器外框（iOS 地址栏 / 状态栏）开机就涂成这一套的页面底色；进来之后 personalizationTheme.ts 按实际底色再校一次
          var page = (known ? pages[uiTheme] : pages.classic)[resolved === "dark" ? 1 : 0];
          // 启动底色：内置的写在下面的 <style> 里，主题包的在这里补一条
          if (known && uiTheme !== "pearl" && uiTheme !== "liquid-glass") {
            var bootStyle = document.createElement("style");
            bootStyle.textContent = "html.fx-booting, html.fx-booting body { background: " + page + " !important; }";
            document.head.appendChild(bootStyle);
          }
          var meta = document.createElement("meta");
          meta.name = "theme-color";
          meta.content = page;
          document.head.appendChild(meta);
        } catch (error) {
          document.documentElement.classList.add("fx-booting", "light");
        }
      })();
    </script>
    <style>
      /* 脚本还没跑起来之前：先铺页面底色，不闪白；慢的时候顶上出一条细进度条。React 挂上后整块被替换。 */
      html.fx-booting, html.fx-booting body { margin: 0; background: #f5f5f7; }
      html.fx-booting.dark, html.fx-booting.dark body { background: #1e1e1e; }

      html.fx-booting[data-ui-theme="liquid-glass"], html.fx-booting[data-ui-theme="liquid-glass"] body { background: #f8f9fb; }
      html.fx-booting.dark[data-ui-theme="liquid-glass"], html.fx-booting.dark[data-ui-theme="liquid-glass"] body { background: #111318; }
      html.fx-booting[data-ui-theme="pearl"], html.fx-booting[data-ui-theme="pearl"] body { background: #f4f6f5; }
      html.fx-booting.dark[data-ui-theme="pearl"], html.fx-booting.dark[data-ui-theme="pearl"] body { background: #161b1e; }
      #fx-boot { position: fixed; inset: 0 0 auto 0; height: 2px; overflow: hidden; opacity: 0; animation: fx-boot-in 0.2s ease 0.25s forwards; }
      #fx-boot::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: linear-gradient(90deg, #6cc4f5, #3ea4ec); animation: fx-boot-run 1.1s ease-in-out infinite; }
      @keyframes fx-boot-in { to { opacity: 1; } }
      @keyframes fx-boot-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #fx-boot::after { animation: none; width: 100%; } }
    </style>
  </head>

  <body>
    <div id="root"><div id="fx-boot" aria-hidden="true"></div></div>
    <div id="forwardx-overlay-root" data-forwardx-overlay-root></div>
    <script type="module" src="/client/src/main.tsx"></script>
  </body>

</html>
