name: Release Panel

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: forwardx-release-panel-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-panel:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="v$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release versions and tag
        env:
          FORWARDX_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: pnpm check:versions

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run panel tests
        run: pnpm test:all

      - name: Run Agent tests and vet
        shell: bash
        run: |
          (cd agent && go test ./... && go vet ./...)
          (cd forwardx-fxp && go test ./... && go vet ./...)

      - name: Build panel assets
        run: pnpm build

      - name: Build bundled Agent assets
        run: bash scripts/build-agent-release.sh

      - name: Package panel runtime bundle
        shell: bash
        env:
          VERSION_NO_V: ${{ steps.release.outputs.version_no_v }}
        run: |
          mkdir -p .release dist/panel
          BUNDLE="forwardx-panel-v${VERSION_NO_V}.tar.gz"
          tar -czf ".release/${BUNDLE}" \
            dist \
            client/dist \
            drizzle \
            patches \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            scripts/install-panel-local.sh \
            scripts/install-panel-docker.sh \
            scripts/migrate-agent-legacy.sh \
            scripts/fetch-client-logos.mjs \
            scripts/install-mimic.sh
          cp ".release/${BUNDLE}" "dist/panel/${BUNDLE}"
          ls -lh "dist/panel/${BUNDLE}"

      - name: Upload panel bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: forwardx-panel-bundle
          path: dist/panel/*.tar.gz

      - name: Publish panel bundle to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(dist/panel/*.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Panel release bundle was not generated"
            exit 1
          fi

          # 发布页只放版本号和文件，不附说明文字。
          if ! gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" \
              --target "$GITHUB_SHA" \
              --notes ""
          fi

          attempt=1
          delay=8
          until gh release upload "$RELEASE_VERSION" "${files[@]}" --clobber; do
            if [ "$attempt" -ge 5 ]; then
              echo "::error::Panel bundle upload failed after ${attempt} attempts"
              exit 1
            fi
            echo "Panel bundle upload failed, retrying in ${delay}s (attempt ${attempt}/5)..."
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

  # 手动在 main 上跑这个工作流时，标签是上面用 GITHUB_TOKEN 建的；GitHub 不会因为这种标签触发
  # 其它工作流的 push: tags，于是 Agent / APK / IPA 永远不会自己跑，Release 里缺文件，面板上的
  # 下载链接 404（2.3.433～2.3.435 就是这么缺的）。这里直接在新标签上把它们 dispatch 起来。
  # 推标签触发的那次不用管：三个工作流自己就会跑。
  dispatch-release-builds:
    needs: release-panel
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Agent / Android APK / iOS IPA builds on the release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-panel.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run release-agent.yml --ref "$RELEASE_TAG"
          gh workflow run android-apk.yml --ref "$RELEASE_TAG" -f build_type=release
          gh workflow run ios-ipa.yml --ref "$RELEASE_TAG"
          echo "Dispatched release-agent / android-apk / ios-ipa on $RELEASE_TAG"

  docker-image:
    needs: release-panel
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
