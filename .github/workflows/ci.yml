name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # 手动补跑：GitHub 偶尔不给 PR 发 pull_request 事件（2026-10-15 #121 两次推送都没起 CI），
  # 这时在分支上手动触发一次，不用靠空提交。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forwardx-ci-${{ github.ref }}
  cancel-in-progress: true

# 拆成几个并行的任务：类型检查、面板测试、构建和文档、Go（agent / fxp 各一个）。
# 最后的 verify 汇总结果，名字和以前那个单任务一样，分支保护里要求的检查不用改。
jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check versions
        run: pnpm check:versions

      - name: Type check
        run: pnpm exec tsc --noEmit

      # ESLint 基线：只拦新增（规则 → 文件的条数超过 scripts/lint-baseline.json 就失败）
      - name: Lint
        run: pnpm lint

  panel-tests:
    name: Panel tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run panel tests
        run: pnpm test:all

  build:
    name: Build and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build panel
        run: pnpm build

      - name: Build docs
        run: pnpm docs:build

  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - agent
          - forwardx-fxp
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      # go.mod 里写的是 go 1.24（本地老工具链也能编），CI 和发布用下面这个受支持的版本，不自动换工具链。
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: |
            agent/go.sum
            forwardx-fxp/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Cross-compile linux/arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null .

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      # staticcheck 先只看正确性类检查（SA），而且只报告不拦：第一次在 CI 上跑出来的问题清掉以后，
      # 去掉 continue-on-error 让它开始拦。
      - name: staticcheck
        continue-on-error: true
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" -checks "SA*" ./...

  # 面板 + 真 Agent 联调（e2e/）：面板跑在 runner 上，入口 / 两台中转 Agent 和落地跑在 docker compose 里，
  # 按用户会做的事走一遍（主备、人工指定、交回、按时段、中转挂了自动切 / 回来切回、重新下发），每一步用
  # 真流量核对走的是哪台中转，并核对期望 vs 实际对账没有差异。Agent 从这次构建的面板装，所以测的是这次的 Agent。
  e2e:
    name: E2E (panel + agents)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: |
            agent/go.sum
            forwardx-fxp/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build panel
        run: pnpm build

      # 装机脚本要的 Agent / FXP / gost 二进制（面板从 dist/agent 发给容器里的 Agent）；gost 用官方成品，省下自编的几分钟。
      - name: Build agent assets
        run: GOCACHE="$(go env GOCACHE)" NEX_GOST_SOURCE=upstream bash scripts/build-agent-release.sh

      - name: Panel + agents scenario
        run: bash e2e/run.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e/out
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: verify
    if: always()
    needs:
      - typecheck
      - panel-tests
      - build
      - go
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a CI job did not succeed ($result)"
              exit 1
            fi
          done
