name: Release Agent

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  # 查同一个提交上 CI 有没有跑过（见下面 Check CI result）。
  actions: read

concurrency:
  group: forwardx-release-agent-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-agent:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: |
            agent/go.sum
            forwardx-fxp/go.sum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="v$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release versions and tag
        env:
          FORWARDX_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run check:versions

      # 同一个提交在 main 上已经跑过完整 CI 并且通过，就不再重跑 Go 测试（发布面板那边同样处理）。
      - name: Check CI result for this commit
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          passed=false
          if count="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="${GITHUB_SHA}" -f status=success -f per_page=50 \
              --jq '[.workflow_runs[] | select(.head_sha == $ENV.GITHUB_SHA and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | length')"; then
            if [ "${count:-0}" -gt 0 ] 2>/dev/null; then
              passed=true
            fi
          else
            echo "::warning::Could not query CI runs for ${GITHUB_SHA}; running Go tests"
          fi
          echo "CI already passed on ${GITHUB_SHA}: ${passed}"
          echo "passed=${passed}" >> "$GITHUB_OUTPUT"

      - name: Run Agent tests and vet
        if: steps.ci.outputs.passed != 'true'
        shell: bash
        run: |
          (cd agent && go test ./... && go vet ./...)
          (cd forwardx-fxp && go test ./... && go vet ./...)

      - name: Build Linux Agent binaries
        run: bash scripts/build-agent-release.sh

      - name: Upload Agent binaries to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          files=(
            dist/agent/forwardx-agent-linux-amd64
            dist/agent/forwardx-agent-linux-arm64
            dist/agent/forwardx-fxp-linux-amd64
            dist/agent/forwardx-fxp-linux-arm64
            dist/agent/forwardx-runtime-linux-amd64
            dist/agent/forwardx-runtime-linux-arm64
            # mita（Mieru 服务端，GPLv3 独立程序）：哈希钉在 shared/mitaAssets.ts，面板经 /api/agent/assets 转发
            dist/agent/forwardx-mita-linux-amd64
            dist/agent/forwardx-mita-linux-arm64
            dist/agent/SHA256SUMS
            dist/agent/THIRD_PARTY_NOTICES.md
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing release artifact: $file" >&2
              exit 1
            fi
          done

          attempt=1
          until gh release view "$RELEASE_VERSION" >/dev/null 2>&1; do
            if [ "$attempt" -ge 120 ]; then
              echo "::error::GitHub Release $RELEASE_VERSION was not created by the panel workflow within 30 minutes"
              exit 1
            fi
            echo "Waiting for panel workflow to create GitHub Release $RELEASE_VERSION (attempt ${attempt}/120)..."
            sleep 15
            attempt=$((attempt + 1))
          done

          upload_with_retry() {
            local attempt=1
            local max_attempts=5
            local delay=8
            until gh release upload "$RELEASE_VERSION" "${files[@]}" --clobber; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "GitHub Release upload failed after ${attempt} attempts" >&2
                return 1
              fi
              echo "GitHub Release upload failed, retrying in ${delay}s (attempt ${attempt}/${max_attempts})..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          upload_with_retry
