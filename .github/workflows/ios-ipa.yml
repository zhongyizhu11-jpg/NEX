name: iOS IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'client/**'
      - 'shared/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/*ios*'
      - '.github/workflows/ios-ipa.yml'
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: forwardx-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'
      - run: pnpm install --frozen-lockfile
      - name: Validate headless icon conversion
        run: xcrun swift scripts/prepare-ios-assets.swift "$PWD"
      - name: Validate versions and application code
        env:
          FORWARDX_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          pnpm check:versions
          pnpm exec tsc --noEmit
          pnpm test:all
      - name: Build unsigned device IPA
        env:
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: pnpm mobile:ipa
      - name: Upload IPA for self-signing
        uses: actions/upload-artifact@v4
        with:
          name: forwardx-ios-unsigned-${{ github.run_number }}
          path: |
            ios/build/*-unsigned.ipa
            ios/build/*-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: forwardx-ios-unsigned-${{ github.run_number }}
          path: ipa
      - name: Attach to the existing panel release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for attempt in $(seq 1 180); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" ipa/*
              exit 0
            fi
            sleep 10
          done
          echo 'Panel release not found; IPA remains available in workflow artifacts.' >&2
          exit 1
