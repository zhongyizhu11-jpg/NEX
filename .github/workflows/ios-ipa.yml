name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '给已有的发布补 IPA（例如 v2.3.507）：用那个 tag 的代码打包并挂到它的 Release；留空 = 按所选分支 / tag'
        required: false
        default: ''
  pull_request:
    paths:
      - 'ios/**'
      - 'client/**'
      - 'shared/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/*ios*'
      - '.github/workflows/ios-ipa.yml'
      - '.github/workflows/ios-ipa-build.yml'
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  actions: read

concurrency:
  group: forwardx-ios-${{ github.ref }}-${{ inputs.release_tag || '' }}
  cancel-in-progress: false

# 先在 Intel 的 macOS 15 上打。
# Apple Silicon（macos-15）机器 GitHub 那边容量不够：2.3.506 起几乎每次都是「The job was not acquired
# by Runner of type hosted even after multiple attempts」，排 15 分钟一步没跑就被取消。打出来的是
# 真机 arm64 的包（generic/platform=iOS），在哪种 Mac 上编译都一样。Intel 那台不行（排不上、Xcode 版本没有）
# 才换 Apple Silicon 再试一次。
jobs:
  build:
    uses: ./.github/workflows/ios-ipa-build.yml
    with:
      runner: macos-15-intel
      ref: ${{ inputs.release_tag || '' }}
      release_tag: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name || '') }}

  build-arm:
    needs: build
    if: ${{ always() && needs.build.result != 'success' && needs.build.result != 'skipped' }}
    uses: ./.github/workflows/ios-ipa-build.yml
    with:
      runner: macos-15
      ref: ${{ inputs.release_tag || '' }}
      release_tag: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name || '') }}

  publish:
    # 只有发布才挂到 Release：打 tag（或在 tag 上手动跑），或者手动补发时填了 release_tag。
    if: >-
      always()
      && (needs.build.result == 'success' || needs.build-arm.result == 'success')
      && (inputs.release_tag != '' && inputs.release_tag != null
          || github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    needs: [build, build-arm]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: forwardx-ios-unsigned-${{ github.run_number }}-*
          merge-multiple: true
          path: ipa
      - name: Attach to the existing panel release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          ls -l ipa
          for attempt in $(seq 1 180); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              # 补发时 Release 上可能已经有同名的旧文件，覆盖掉。
              gh release upload "$RELEASE_TAG" ipa/* --clobber
              exit 0
            fi
            sleep 10
          done
          echo 'Panel release not found; IPA remains available in workflow artifacts.' >&2
          exit 1
