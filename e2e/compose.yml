# 面板 + 真 Agent 联调用的几台「机器」（e2e/scenario.ts 起、停、查日志；面板本身跑在宿主机上）。
#
# 一个独立网段，地址写死，场景脚本按地址判「流量真走了哪台」：
#   入口 10.77.0.11 · 中转 A 10.77.0.21 · 中转 B 10.77.0.22 · 落地 10.77.0.31 · 面板 = 网关 10.77.0.1:9810
#
# Agent 镜像就是 docker/agent/Dockerfile 那一个（只带依赖），Agent 本身从面板装（PANEL_URL/api/agent/install.sh），
# 场景脚本先把面板设成「优先从面板装」，所以测的是面板这次构建出来的 Agent，不是 GitHub 上发过的版本。
# 落地复用同一个镜像里的 socat。Token 变量默认空：stop / logs / down 这些不需要它的命令也能跑；up 一定带着。
name: nex-e2e

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.0.0/24
          gateway: 10.77.0.1

services:
  entry:
    build:
      context: ..
      dockerfile: docker/agent/Dockerfile
    image: nex-agent-e2e:local
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      PANEL_URL: http://10.77.0.1:9810
      AGENT_TOKEN: ${ENTRY_TOKEN:-}
    networks:
      lab:
        ipv4_address: 10.77.0.11

  relay-a:
    image: nex-agent-e2e:local
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      PANEL_URL: http://10.77.0.1:9810
      AGENT_TOKEN: ${RELAY_A_TOKEN:-}
    networks:
      lab:
        ipv4_address: 10.77.0.21

  relay-b:
    image: nex-agent-e2e:local
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      PANEL_URL: http://10.77.0.1:9810
      AGENT_TOKEN: ${RELAY_B_TOKEN:-}
    networks:
      lab:
        ipv4_address: 10.77.0.22

  # 落地：连上先写回「谁连的我」（就是真走的那台中转的地址），然后原样回显。$$ 是 compose 的转义，容器里是 $SOCAT_PEERADDR。
  target:
    image: nex-agent-e2e:local
    entrypoint: ["socat", "-d", "TCP-LISTEN:9000,fork,reuseaddr", "SYSTEM:echo $$SOCAT_PEERADDR; exec cat"]
    networks:
      lab:
        ipv4_address: 10.77.0.31
